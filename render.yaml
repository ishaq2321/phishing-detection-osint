#################################################################
# PhishGuard backend — Render Blueprint                       #
#################################################################
# Auto-deploy: OFF. Use the manual "Deploy" button on the   #
# Render dashboard, or hit this service's Deploy Hook URL.  #
#                                                            #
# Path filter: even if auto-deploy were on, only commits    #
# that change files inside backend/ (or its requirements    #
# files) would trigger a build. Edits to docs/, frontend/,  #
# README.md, or any other non-backend path are ignored.     #
#################################################################

services:
  - type: web
    name: phishguard-api
    runtime: python
    region: frankfurt
    plan: free

    # ------------------------------------------------------------------
    # Source and build
    # ------------------------------------------------------------------
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements-prod.txt
    # The en_core_web_sm model is installed via the direct .whl URL
    # in requirements-prod.txt (spacy 3.7.2 + en_core_web_sm 3.7.1).
    # Do NOT run `python -m spacy download` here — it may pull an
    # incompatible version and 404 on Render.
    #
    # Working directory is repo root on Render by default. The
    # backend package lives at backend/, so cd into it before
    # launching uvicorn. main:app is the FastAPI instance inside
    # backend/main.py.
    startCommand: |
      cd backend && exec uvicorn main:app --host 0.0.0.0 --port $PORT

    # ------------------------------------------------------------------
    # Deployment behaviour — never auto-deploy on a git push.
    #   'autoDeployTrigger: off' replaces the deprecated 'autoDeploy: false'
    #  ipAllowList is deliberately omitted (this is a public API).
    #  The value MUST be quoted as a string in YAML; otherwise the bare
    #  token 'off' is parsed as the boolean false, which Render rejects.
    # ------------------------------------------------------------------
    autoDeployTrigger: 'off'

    # ------------------------------------------------------------------
    # Path filter — defence in depth. If Render ever ignores the
    # autoDeployTrigger setting (e.g. after a service migration), the
    # buildFilter ensures only meaningful backend changes can
    # trigger a deploy. glob syntax relative to repo root.
    # ------------------------------------------------------------------
    buildFilter:
      paths:
        - backend/**/*.py
        - backend/**/*.txt
        - backend/**/*.cfg
        - backend/**/*.toml
        - backend/main.py
        - render.yaml
      ignoredPaths:
        - docs/**
        - frontend/**
        - data/**
        - .github/**
        - .vscode/**
        - "*.md"

    # ------------------------------------------------------------------
    # Health check (Tier 1.6: split liveness/readiness)
    #
    # Render probes ``healthCheckPath`` every 10 s.  Two endpoints
    # are available:
    #
    #   /api/health/live   -- no I/O, sub-50 ms; recommended for any
    #                         high-frequency monitor.  Returns 200
    #                         whenever the FastAPI event loop is alive.
    #   /api/health/ready  -- deep DNS + ML probes; recommended for
    #                         readiness checks (load balancer).  Maps
    #                         to 503 only when *unhealthy*.
    #   /api/health        -- kept as an alias for /ready so existing
    #                         dashboards that baked in the path keep
    #                         working.
    #
    # We point Render at ``/api/health/live`` so the per-second readiness
    # scans never burn our latency budget on actual DNS queries.
    # ------------------------------------------------------------------
    healthCheckPath: /api/health/live

    # ------------------------------------------------------------------
    # Environment variables
    #
    # Two groups:
    #
    # 1. Hardcoded values that promote the application to its
    #    production posture at boot -- no dashboard action required.
    # 2. Secrets marked ``sync: false`` -- managed ONLY via the Render
    #    dashboard so they never leak into version control.
    # ------------------------------------------------------------------
    envVars:
      # -- Core runtime ---------------------------------------------------
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        # Force Python stdout/stderr to flush on every write -- so
        # we never lose a log line on a uvicorn reload.
        value: "1"
      - key: PYTHON_VERSION
        # Full-qualified version string per
        # https://docs.render.com/python-version
        value: "3.10.12"

      # -- Observability (Tier 1.4) ---------------------------------------
      # Production emits one JSON log object per line via structlog so
      # Render's built-in log explorer can ingest them cleanly.
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        # INFO by default; bump to DEBUG for incident post-mortems.
        value: INFO

      # -- Rate-limit knobs (Tier 1.2) ------------------------------------
      # Each line is documented in backend/api/rate_limiting.py.
      - key: PHISHGUARD_DEFAULT_RATE_LIMIT
        value: 60/minute
      - key: PHISHGUARD_STATUS_RATE_LIMIT
        value: 10/minute
      - key: PHISHGUARD_ANALYZE_RATE_LIMIT
        value: 30/minute
      - key: PHISHGUARD_RATE_LIMIT_URI
        # memory:// is appropriate for the Render free-plan single-instance
        # topology.  Switch to redis://... for multi-instance production.
        value: memory://

      # -- Health/Readiness timeouts (Tier 1.6) --------------------------
      - key: PHISHGUARD_HEALTH_DNS_TIMEOUT
        value: "3.0"
      - key: PHISHGUARD_HEALTH_ML_TIMEOUT
        value: "1.0"

      # -- EML ingestion cap (Tier 4 E) -----------------------------------
      # Maximum raw .eml payload in bytes.  Larger uploads → 413.
      - key: EML_MAX_BYTES
        value: "1000000"

      # -- Secrets (managed ONLY via the Render dashboard) ----------------
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Tier 1.3 -- gate /api/analyze* with an X-Api-Key header.  Leave
      # unset to disable authentication (public demo) or set to a
      # comma-separated list of accepted keys.
      - key: APIKEYS
        sync: false
